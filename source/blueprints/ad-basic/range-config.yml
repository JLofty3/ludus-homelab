# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
#
# Basic Active Directory lab
#   VLAN 10  (10.<range>.10.0/24)  DC01 domain controller, WS01 Windows 11 workstation
#   VLAN 99  (10.<range>.99.0/24)  Kali
#
# The `lab` launcher can change the domain name, add workstations or a member
# server, drop Kali, install Office and shrink RAM before deploying. Deploying
# this file as-is gives you the defaults below (about 18 GB RAM with the router).

ludus:
  - vm_name: "{{ range_id }}-dc01"
    hostname: DC01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 6
    cpus: 4
    windows:
      sysprep: false
    domain:
      fqdn: homelab.lan
      role: primary-dc

  - vm_name: "{{ range_id }}-ws01"
    hostname: WS01
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 21
    ram_gb: 6
    cpus: 4
    windows:
      install_additional_tools: true
    domain:
      fqdn: homelab.lan
      role: member

  - vm_name: "{{ range_id }}-kali"
    hostname: kali
    template: kali-x64-desktop-template
    vlan: 99
    ip_last_octet: 1
    ram_gb: 4
    cpus: 4
    linux: true
    testing:
      snapshot: false
      block_internet: false

network:
  inter_vlan_default: REJECT
  rules:
    - name: Windows to Kali on web ports only
      vlan_src: 10
      vlan_dst: 99
      protocol: tcp
      ports: 80,443,8080
      action: ACCEPT
    - name: Kali to the Windows VLAN on any port
      vlan_src: 99
      vlan_dst: 10
      protocol: all
      ports: all
      action: ACCEPT

defaults:
  timezone: Europe/London
