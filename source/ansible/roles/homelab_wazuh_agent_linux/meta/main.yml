galaxy_info:
  role_name: homelab_wazuh_agent_linux
  author: homelab
  description: Installs a Wazuh agent on Debian, Ubuntu or Rocky Linux and points it at the Wazuh server in the same Ludus range.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: EL
      versions:
        - "8"
        - "9"
dependencies: []
